<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto AI Agent Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            grid-column: 1 / -1;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-refresh {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .btn-refresh:active {
            transform: translateY(0);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border-left: 4px solid #e0e0e0;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .card.signal-buy {
            border-left-color: #10b981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05) 0%, transparent 100%);
        }

        .card.signal-sell {
            border-left-color: #ef4444;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.05) 0%, transparent 100%);
        }

        .card.signal-neutral {
            border-left-color: #f59e0b;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.05) 0%, transparent 100%);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
        }

        .card-timeframe {
            font-size: 0.85em;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .price {
            font-size: 2.2em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 15px;
            font-variant-numeric: tabular-nums;
        }

        .indicator-row {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .indicator-label {
            font-weight: 600;
            color: #666;
            font-size: 0.9em;
        }

        .indicator-value {
            font-weight: 700;
            color: #333;
            font-variant-numeric: tabular-nums;
            font-size: 1.1em;
        }

        .rsi-bar {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .rsi-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981);
            transition: width 0.3s ease;
        }

        .signal {
            font-size: 1.2em;
            font-weight: 700;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .signal-buy {
            background: #d1fae5;
            color: #065f46;
        }

        .signal-sell {
            background: #fee2e2;
            color: #7f1d1d;
        }

        .signal-neutral {
            background: #fef3c7;
            color: #92400e;
        }

        .strength {
            font-size: 0.85em;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #7f1d1d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .timestamp {
            font-size: 0.8em;
            color: #999;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .price {
                font-size: 1.8em;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Crypto AI Agent</h1>
            <p>Live Buy/Sell Signals • Multi-Timeframe Analysis</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="symbol">Cryptomoneta</label>
                <select id="symbol">
                    <option value="SOL-USDT">Solana (SOL)</option>
                    <option value="BTC-USDT">Bitcoin (BTC)</option>
                    <option value="ETH-USDT">Ethereum (ETH)</option>
                    <option value="ADA-USDT">Cardano (ADA)</option>
                    <option value="XRP-USDT">Ripple (XRP)</option>
                    <option value="DOT-USDT">Polkadot (DOT)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="timeframe1">Timeframe 1</label>
                <select id="timeframe1">
                    <option value="5min">5 Minuti</option>
                    <option value="15min" selected>15 Minuti</option>
                    <option value="1hour">1 Ora</option>
                    <option value="4hour">4 Ore</option>
                </select>
            </div>

            <div class="control-group">
                <label for="timeframe2">Timeframe 2</label>
                <select id="timeframe2">
                    <option value="5min">5 Minuti</option>
                    <option value="15min">15 Minuti</option>
                    <option value="1hour" selected>1 Ora</option>
                    <option value="4hour">4 Ore</option>
                </select>
            </div>

            <div class="control-group">
                <label for="timeframe3">Timeframe 3</label>
                <select id="timeframe3">
                    <option value="5min">5 Minuti</option>
                    <option value="15min">15 Minuti</option>
                    <option value="1hour">1 Ora</option>
                    <option value="4hour" selected>4 Ore</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn-refresh" onclick="fetchAllData()">⚡ Aggiorna Ora</button>
                <button class="btn-refresh" onclick="toggleAutoRefresh()" id="autoBtn">🔄 Auto-Refresh ON</button>
            </div>
        </div>

        <div id="error"></div>
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p style="margin-top: 15px;">Caricamento dati...</p>
        </div>

        <div class="dashboard" id="dashboard"></div>
    </div>

    <script>
        const API_BASE = 'https://crypto-dashboard-api-h1wl.onrender.com/api/analyze';
        let autoRefreshInterval = null;
        let autoRefreshEnabled = true;

        async function fetchAnalysis(symbol, timeframe) {
            try {
                const response = await fetch(`${API_BASE}?symbol=${symbol}&timeframe=${timeframe}`);
                if (!response.ok) throw new Error(`API error: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`Error fetching ${symbol} ${timeframe}:`, error);
                return null;
            }
        }

        async function fetchAllData() {
            const symbol = document.getElementById('symbol').value;
            const timeframes = [
                document.getElementById('timeframe1').value,
                document.getElementById('timeframe2').value,
                document.getElementById('timeframe3').value
            ];

            showLoading(true);
            clearError();

            const results = await Promise.all(
                timeframes.map(tf => fetchAnalysis(symbol, tf))
            );

            if (results.some(r => r === null)) {
                showError('⚠️ Errore nel caricamento di alcuni dati. Riprova tra pochi secondi.');
            }

            renderDashboard(symbol, timeframes, results);
            showLoading(false);
        }

        function renderDashboard(symbol, timeframes, results) {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '';

            results.forEach((data, idx) => {
                if (!data) return;

                const signalClass = `signal-${data.signal.toLowerCase()}`;
                const rsiPercent = (data.rsi / 100) * 100;

                const card = document.createElement('div');
                card.className = `card ${signalClass}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">${symbol}</div>
                        <div class="card-timeframe">${timeframes[idx]}</div>
                    </div>

                    <div class="price">$${data.price.toFixed(2)}</div>

                    <div class="indicator-row">
                        <span class="indicator-label">RSI (14)</span>
                        <span class="indicator-value">${data.rsi.toFixed(1)}</span>
                    </div>
                    <div class="rsi-bar">
                        <div class="rsi-fill" style="width: ${rsiPercent}%"></div>
                    </div>

                    <div class="indicator-row" style="margin-top: 16px;">
                        <span class="indicator-label">EMA20</span>
                        <span class="indicator-value">$${data.ema20.toFixed(2)}</span>
                    </div>

                    <div class="indicator-row">
                        <span class="indicator-label">EMA50</span>
                        <span class="indicator-value">$${data.ema50.toFixed(2)}</span>
                    </div>

                    <div class="signal signal-${data.signal.toLowerCase()}">
                        ${data.signal === 'BUY' ? '📈' : data.signal === 'SELL' ? '📉' : '⚖️'} ${data.signal}
                    </div>

                    <div class="strength">Forza: ${data.strength > 0 ? '+' : ''}${data.strength}</div>

                    <div class="timestamp">
                        ${new Date(data.timestamp).toLocaleTimeString('it-IT')}
                    </div>
                `;

                dashboard.appendChild(card);
            });
        }

        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            const btn = document.getElementById('autoBtn');

            if (autoRefreshEnabled) {
                btn.textContent = '🔄 Auto-Refresh ON';
                startAutoRefresh();
            } else {
                btn.textContent = '⏸ Auto-Refresh OFF';
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
                if (autoRefreshEnabled) {
                    fetchAllData();
                }
            }, 30000); // 30 secondi
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(msg) {
            document.getElementById('error').innerHTML = `<div class="error">${msg}</div>`;
        }

        function clearError() {
            document.getElementById('error').innerHTML = '';
        }

        // Event listeners
        document.getElementById('symbol').addEventListener('change', fetchAllData);
        document.getElementById('timeframe1').addEventListener('change', fetchAllData);
        document.getElementById('timeframe2').addEventListener('change', fetchAllData);
        document.getElementById('timeframe3').addEventListener('change', fetchAllData);

        // Carica dati al caricamento della pagina
        window.addEventListener('load', () => {
            fetchAllData();
            startAutoRefresh();
        });

        // Stop auto-refresh quando la finestra perde focus
        window.addEventListener('blur', () => {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        });

        window.addEventListener('focus', () => {
            if (autoRefreshEnabled) startAutoRefresh();
        });
    </script>
</body>
</html>
